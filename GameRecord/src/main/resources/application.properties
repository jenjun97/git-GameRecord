spring.application.name=GameRecord

#view的前後綴
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false

#資料庫連線設定
#spring.datasource.url=jdbc:mysql://172.233.76.34:3306/jundb?socketTimeout=300000&autoReconnect=true&encrypt=false
#spring.datasource.username=jenjun
#spring.datasource.password=Jun@0123456789+-*/
spring.datasource.url=jdbc:mysql://localhost:3306/games_record_site?socketTimeout=300000&autoReconnect=true&encrypt=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

#Spring Boot 預設會使用 HikariCP 作為連線池
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5


#決定 Hibernate 在應用啟動時，如何自動處理資料庫表結構
spring.jpa.hibernate.ddl-auto=update
#資料庫的 SQL 語句都會在控制台中印出來
spring.jpa.show-sql=true

# 設置Session超時時間(分鐘)
server.servlet.session.timeout=720m

# 明確指定使用 logback-spring.xml 作為日誌配置文件
logging.config=classpath:logback-spring.xml

server.address=0.0.0.0
server.port=8080
#server.servlet.context-path=/GamesRecord

#允許最大檔案大小和整體請求大小
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB