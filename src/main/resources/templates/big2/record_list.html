<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>Getting Started: Serving Web Content</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
	<!-- ───────────────── ① 總分區 ───────────────── -->
	<table border=1>
	    <thead>
	        <tr>
	            <th>姓名</th>
	            <th th:each="p : *{scoreboardResponseDto.playerNameList}" th:text="${p}">name</th>
	        </tr>
	    </thead>
	    <tbody>
	        <tr>
	            <td>目前總分</td>
				   <td th:each="sumScore : *{scoreboardResponseDto.sumScoreList}"
				       th:text="${sumScore}" style="width:4rem;">0</td>
	        </tr>
	    </tbody>
	</table>

	<!-- ───────────────── ② 新增比分區 ───────────────── -->
	<h4 class="section-title">新增分數 (只要輸入負分)</h4>
	<form th:action="@{/big2/add_score}" method="post">
	    <input type="hidden" name="deskUuid" th:value="*{scoreboardResponseDto.deskUuid}" />
	    <table border=1>
	        <thead>
	            <tr>
	                <th>姓名</th>
	                <th th:each="p : *{scoreboardResponseDto.playerNameList}" th:text="${p}">name</th>
	            </tr>
	        </thead>
	        <tbody>
	            <tr>
	                <td>輸分</td>
	                <td th:each="p,idx : *{scoreboardResponseDto.playerNameList}">
	                    <input type="phone" name="score"
	                           step="1" placeholder="輸分"
	                           style="width:4rem;">
	                </td>
	            </tr>
	        </tbody>
	    </table>
	    <button type="submit" class="btn btn-primary mt-2">送出</button>
	</form>
